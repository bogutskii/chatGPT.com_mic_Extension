<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice to Text</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 180px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
    }
    .popup-container {
      padding: 12px;
    }
    .popup-title {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a2e;
      margin: 0 0 10px;
      text-align: center;
    }
    .popup-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .popup-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      color: #333;
      background: #fff;
      border: 1px solid #e5e7eb;
      transition: all 0.15s ease;
    }
    .popup-link:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }
    .popup-link svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .popup-link.github svg { fill: #333; }
    .popup-link.donate svg { fill: #ef4444; }
    .popup-link.linkedin svg { fill: #0a66c2; }
  </style>
</head>
<body>
  <div class="popup-container">
    <h3 class="popup-title">Voice to Text <span id="version" style="font-size: 11px; font-weight: 400; color: #888;"></span></h3>
    <div class="popup-actions" style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px;">
      <button id="centerMic" class="popup-link" style="border: none; cursor: pointer; width: 100%; justify-content: center;">
        Center Mic
      </button>
      <button id="centerPanel" class="popup-link" style="border: none; cursor: pointer; width: 100%; justify-content: center;">
        Center Panel
      </button>
    </div>
    <div class="popup-links">
      <a href="https://www.linkedin.com/in/petr-bogutskii/" target="_blank" rel="noopener noreferrer" class="popup-link linkedin">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </a>
      <a href="https://buymeacoffee.com/bogutskii" target="_blank" rel="noopener noreferrer" class="popup-link donate">
        <svg viewBox="0 0 24 24"><path d="M18.5 3H6c-1.1 0-2 .9-2 2v5.71c0 3.83 2.95 7.18 6.78 7.29 3.96.12 7.22-3.06 7.22-7v-1h.5c1.93 0 3.5-1.57 3.5-3.5S20.43 3 18.5 3zM16 8.99c0 2.2-1.35 4.21-3.42 5.06-.41.17-.85.24-1.28.2-2.56-.2-4.59-2.36-4.7-4.93V6h9.4v2.99zM18.5 8h-.5V5h.5c.83 0 1.5.67 1.5 1.5S19.33 8 18.5 8zM4 19h16v2H4v-2z"/></svg>
        Buy Me a Coffee

    </div>
    <div style="text-align: center; font-size: 11px; color: #888; margin-top: 10px;">by Petr Bogutskii</div>
  </div>
  <script src="popup.js"></script>

</html>
